<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkiPlan — 스키 여행 계획</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>⛷ SkiPlan</h1>
      <nav class="nav-tabs" id="nav-tabs">
        <button data-view="map" class="active">지도</button>
        <button data-view="trips">내 여행</button>
      </nav>
    </div>

    <div class="user">
      <span id="username"></span>님
      <button id="logout-btn">로그아웃</button>
    </div>
  </header>

  <!-- 화면 1: 지도 | 검색 + 사이드바, 지도 아래 정보 패널 -->
  <main id="view-map" class="layout">
    <section class="map-area">
      <div id="map"></div>

      <div class="map-tools">
        <!-- 클릭 모드: 리조트 = 리조트 점만, 지역 = 시·군 평균 -->
        <div class="seg" id="mode-toggle">
          <button data-mode="resort" class="active">리조트</button>
          <button data-mode="region">지역</button>
        </div>
        <div class="seg">
          <button data-region="all">전체</button>
          <button data-region="KR">한국</button>
          <button data-region="JP">일본</button>
        </div>

        <!-- 지도 라벨과 리조트·지역 이름의 언어 -->
        <div class="lang-menu" id="lang-menu">
          <button id="lang-toggle" class="lang-btn" aria-haspopup="true" aria-expanded="false" title="언어 / Language">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>
            </svg>
            <span id="lang-current">한국어</span> <span class="caret">▾</span>
          </button>
          <ul class="lang-dropdown hidden" id="lang-dropdown">
            <li><button data-lang="ko" class="active">한국어</button></li>
            <li><button data-lang="en">English</button></li>
          </ul>
        </div>
      </div>
      <p id="mode-hint" class="hint"></p>
    </section>

    <!-- 오른쪽 열: 리조트 검색 + 사이드바 -->
    <div class="side-col">
    <section class="search-box">
      <input id="resort-search" type="search" placeholder="리조트 검색" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="search-results">
      <ul id="search-results" class="search-results hidden" role="listbox"></ul>
    </section>

    <aside class="sidebar">
      <section class="side-section">
        <h2>즐겨찾기</h2>
        <ul id="fav-list" class="side-list"><li class="empty">불러오는 중...</li></ul>
      </section>

      <section class="side-section">
        <h2>내 여행 계획</h2>
        <ul id="trip-list"><li class="empty">불러오는 중...</li></ul>
      </section>
    </aside>
    </div>

    <section id="info-panel" class="info-panel">
      <p class="placeholder">리조트를 클릭하거나, 지역을 선택한 뒤 지도를 클릭하면 적설 기록과 예보가 표시됩니다.</p>
    </section>

    <!-- 시스템 배지(응답한 서버, 캐시 여부): 페이지 아래쪽 가운데 -->
    <div id="sys-badges" class="sys-badges"></div>
  </main>
  </main>

  <!-- 화면 2: 내 여행 -->
  <main id="view-trips" class="trips-page hidden">
    <section class="card">
      <h2>즐겨찾기한 리조트 <span class="count" id="fav-count"></span></h2>
      <div id="fav-grid" class="fav-grid"></div>
    </section>

    <section class="card">
      <h2>여행 계획 <span class="count" id="plan-count"></span></h2>
      <div id="plan-list" class="plan-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
