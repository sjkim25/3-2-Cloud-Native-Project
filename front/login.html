<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkiPlan — 로그인</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>⛷ SkiPlan</h1>

    <!-- 로그인 폼과 회원가입 폼 중 하나만 보이고, 아래 링크를 누르면 login.js 전환. 처음에는 로그인 폼이 보임 -->
    <form id="login-form">
      <input type="email" name="email" placeholder="이메일" required>
      <input type="password" name="password" placeholder="비밀번호" required>
      <div id="login-msg" class="msg"></div>
      <button type="submit">로그인</button>
      <p class="switch">계정이 없으신가요? <a id="to-register">회원가입</a></p>
    </form>

    <form id="register-form" class="hidden">
      <input type="text" name="name" placeholder="이름" required maxlength="50">
      <input type="email" name="email" placeholder="이메일" required>
      <input type="password" name="password" placeholder="비밀번호" required>
      <input type="password" name="password2" placeholder="비밀번호 확인" required>
      <div id="register-msg" class="msg"></div>
      <button type="submit">회원가입</button>
      <p class="switch">이미 계정이 있으신가요? <a id="to-login">로그인</a></p>
    </form>
  </div>

  <script src="login.js"></script>
</body>
</html>
